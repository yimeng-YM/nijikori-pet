plugins { id 'fabric-loom' version '1.17.13' }
version = "${project.mod_version}+mc${project.minecraft_version}"
group = 'dev.yimeng'
base { archivesName = 'nijikori-minecraft-bridge' }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
java { withSourcesJar() }

sourceSets {
    verification {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    mods {
        nijikori_minecraft_bridge { sourceSet sourceSets.main }
        nijikori_bridge_verification { sourceSet sourceSets.verification }
    }
    runs {
        verifyClient {
            client(); source sourceSets.verification
            runDir 'run-verification'; vmArg '-Xmx2G'; vmArg '-Dfabric.client.gametest'
            programArg '--width'; programArg '1100'; programArg '--height'; programArg '760'
        }
    }
}
